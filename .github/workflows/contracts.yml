name: Contracts CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Check repository language
        run: python3 scripts/check_no_arabic_persian.py

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Run deterministic tests
        run: forge test --no-match-path test/KOANT.BaseFork.t.sol

  base-fork-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Run Base fork tests
        run: forge test --match-path test/KOANT.BaseFork.t.sol
